name: Sync public project catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    paths:
      - 'config/owners.json'
      - 'scripts/sync_public.py'
      - '.github/workflows/sync-public.yml'

permissions:
  contents: write

concurrency:
  group: project-atlas-public-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public GitHub metadata only
        run: python scripts/sync_public.py
      - name: Validate privacy and output
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/public_snapshot.json', encoding='utf-8'))
          assert d['sync_scope']=='public_repositories_only'
          assert all(r['private'] is False and r['visibility']=='public' for r in d['repositories'])
          assert len({r['id'] for r in d['repositories']})==len(d['repositories'])
          print('public-only validation PASS')
          PY
      - name: Commit refreshed public catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Carry only generated public output into the freshest main revision.
          # This avoids non-fast-forward failures if someone edits the site during a sync.
          cp data/public_snapshot.json "$RUNNER_TEMP/public_snapshot.json"
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp "$RUNNER_TEMP/public_snapshot.json" data/public_snapshot.json
            git add data/public_snapshot.json
            if git diff --cached --quiet; then
              echo "No changes to snapshot"
              pushed=1
              break
            fi
            git commit -m "chore: refresh public portfolio snapshot"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "Concurrent update detected: retrying on latest main"
          done
          test "$pushed" -eq 1
